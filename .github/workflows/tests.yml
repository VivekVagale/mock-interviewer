name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # The tests run offline: no Ollama server and no Whisper model needed.
      - run: pip install "requests>=2.31" "pytest>=8.0" pytest-github-actions-annotate-failures
      - run: python -m pytest -q -rs
