name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The tests run offline: no Ollama server and no Whisper model needed.
      - run: pip install "requests>=2.31" "pytest>=8.0"
      - run: python -m pytest -q
